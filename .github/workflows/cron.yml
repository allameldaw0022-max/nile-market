# ★★★ هذه هي النسخة **العاملة** من جدولة المهام، وتعيش في `main` وحده.
#
# GitHub Actions لا يُشغّل `on: schedule` ولا يُظهر `workflow_dispatch`
# إلا من **الفرع الافتراضي**. وكود التطبيق يعيش في فرع العمل
# (`claude/nile-market-planning-h7544b`) وهو الفرع الذي يَنشر منه
# Vercel — فنسخة هذا الملف هناك موجودة للمرجع ولا تُجدول أبدًا.
# وهذا الملف لا يحتاج شيئًا من كود التطبيق: ثلاث `curl` إلى الإنتاج
# بترويسة السرّ، بلا checkout وبلا npm. فلا يُنقل كود إلى `main`.
#
# ⚠ أي تعديل على الجدولة يجب أن يُنسخ إلى الفرع الآخر ليبقى الاثنان
#   متطابقين — أو يُحذف من هناك ويبقى هنا وحده.

# جدولة المهام المتكرّرة.
#
# خطة Vercel المجانية تسمح بمهمة يومية واحدة لكل مسار، وطابور البريد
# لا يحتمل الانتظار يومًا: رسالة «تم اعتماد اشتراكك» تصل بعد يوم لا
# قيمة لها. لذلك تبقى جدولة Vercel شبكة أمان يومية، ويتولّى هذا
# الـworkflow التشغيل المتكرّر مجانًا.
#
# ★★ الدرس الذي كلّف تشغيلًا فاشلًا: السرّ **غير المضبوط** يتمدّد إلى
#    فراغ بلا أي تحذير من GitHub. فكان النداء يخرج بلا مضيف وبلا
#    ترويسة (`curl: (3) No host part`). لذلك:
#      · النطاق لا يعتمد على سرّ — النطاق العام ليس سرًّا.
#      · والسرّ يُفحَص في خطوة أولى تفشل صريحةً إن كان فارغًا.
#
# الإعداد المطلوب مرّة واحدة (Settings ← Secrets and variables ← Actions):
#   CRON_SECRET   — **إلزامي**، بنفس قيمته في Vercel (موجود هناك).
#   CRON_BASE_URL — اختياري؛ إن لم يُضبط يُستعمل نطاق الإنتاج أدناه.
name: cron

on:
  schedule:
    - cron: '*/10 * * * *'   # طابور البريد
    - cron: '20 * * * *'     # الدومينات المنتظرة
    - cron: '5 * * * *'      # الصيانة الساعيّة (السعة وكنس العدّادات)
  workflow_dispatch:

concurrency:
  group: cron
  cancel-in-progress: false

env:
  # ★ السرّ إن وُجد، وإلا نطاق الإنتاج مباشرةً — فلا يتوقّف التشغيل على
  #   إعدادٍ لا يحمي شيئًا. (نفس قيمة `NEXT_PUBLIC_SITE_URL` في Vercel.)
  BASE_URL: ${{ secrets.CRON_BASE_URL || 'https://nilemarket.online' }}

jobs:
  run:
    runs-on: ubuntu-latest
    # ★ السرّ عبر `env` لا بالحقن في نصّ الأمر: القيمة لا تُطبع في
    #   سطر الأمر الذي يعرضه السجلّ، وGitHub يحجبها في المخرجات.
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: السرّ مضبوط؟
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=CRON_SECRET غير مضبوط::أضِفه في Settings ← Secrets and variables ← Actions بنفس قيمته في Vercel، ثم أعِد التشغيل. المسارات ترفض بـ401 بلا سرّ صحيح — وهذا مقصود."
            exit 1
          fi
          echo "✓ السرّ مضبوط · النطاق: $BASE_URL"

      - name: تفريغ طابور البريد
        if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail-with-body -sS -m 60 \
            -H "authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/v1/cron/emails"

      - name: متابعة الدومينات المنتظرة
        if: github.event.schedule == '20 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail-with-body -sS -m 60 \
            -H "authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/v1/cron/domains"

      # ★ الصيانة الساعيّة هنا لا في vercel.json: الخطة المجانية تسمح
      #   بمهمة يومية واحدة لكل مسار، وجدولة ساعيّة فيها **ترفض النشر**
      #   من أصله (حدث مع `*/10 * * * *` سابقًا). فتبقى في vercel.json
      #   شبكة أمان يوميّة، ويتولّى هذا الـworkflow الساعيّة.
      - name: الصيانة الساعيّة
        if: github.event.schedule == '5 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail-with-body -sS -m 60 \
            -H "authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/v1/cron/upkeep"
